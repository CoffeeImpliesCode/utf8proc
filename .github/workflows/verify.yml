# SPDX-License-Identifier: MIT
#
# Verification for this fork's Zig package.
#
# This file is written for this repository and names this repository's gates.
# It does not replace or retarget the CI that came with the import:
# `.github/workflows/zig.yml`, `make.yml`, `cmake.yml` and `ci-fuzz.yml`, and
# `appveyor.yml`, are upstream's. They build upstream's CMake and Make projects
# and upload to upstream's AppVeyor account. They are left exactly as they
# arrived, they are not referenced by `build.zig`, and they are not in `.paths`.
#
# Four jobs, four different questions:
#   integrity are the compiled bytes, the carried upstream files and the
#              Unicode fixtures still the ones `UPSTREAM.sha256` pins, and are
#              the ones the pinned upstream commit itself carries
#   native    does the archive build here, do the behavioural tests pass in the
#              two modes where Zig's safety checks are live, does every public
#              facade function get *called* by the API exercise, does the example
#              run, does a C program reach the installed header and archive
#              correctly, and does upstream's own C suite pass against it --
#              and the same again through `-Dlinkage=dynamic`, where the
#              delivered artifact is a shared object with upstream's soname, its
#              own export table and the relocatable `libutf8proc.pc` a C consumer
#              is built from
#   cross     does the same public surface compile and link for each of the six
#              targets this package claims, in both deliveries
#   consumer  is `.paths` a complete closure of this repository, and does the
#              published module resolve from a package that did not write it
#
# One thing this workflow deliberately never asks: **is `HEAD` the pinned
# upstream commit?** It is not, and it must not be — this repository is a
# downstream of upstream's tag and carries its own commits on top of it. The
# `integrity` job instead re-derives each carried upstream file from the pinned
# commit's own blob and requires the only divergences to be the four files this
# fork declares it edits in place.
#
# Five things this workflow deliberately does not do.
#
# It does not mark any target `continue-on-error`. Nothing here has been observed
# to fail, and pre-labelling a failure as expected is a claim about a run that
# never happened. If a target turns out to be unsupported, the fix is to say so
# in this file with the compiler output that showed it, not to silence it.
#
# It does not exercise a system-library mode. There is none: this build compiles
# `utf8proc.c` from this repository with no option to link an installed
# libutf8proc, and that is recorded as NOT APPLICABLE in `UPSTREAM.md` rather
# than as a passing gate. The reason is a real one and not an oversight —
# `utf8proc_free` did not exist before 2.12.0, so this tree's header against an
# installed 2.5.0-2.11.3 library would compile and then fail to link.
#
# It does not download the Unicode corpora. `data/download.sh` and
# `data/Makefile` are upstream's maintainer path and need `julia`; the fixtures
# this package tests against are committed under `testdata/`, which is what keeps
# this job network-free.
#
# It does not run `test/charwidth.c`. That program's oracle is the host's
# `wcwidth` through `<wchar.h>`, which is not uniformly available and which
# upstream's own source calls informational; its oracle-free invariants are
# asserted by the Zig tests instead. See `FORK-NOTES.md` section 11.
#
# It does not assert a Unicode version string anywhere. The C-surface gate used
# to compare `utf8proc_unicode_version()` against a literal, which tests the pin
# rather than the library. That claim is owned by `test/misc.c`'s
# `-DUNICODE_VERSION` cross-check against upstream's own `data/Makefile`, which
# the `upstream-test` step runs, and by `UPSTREAM.md`. Both version strings are
# still *printed* by the C gate: a C consumer can read them, which is a fact
# about the archive, not an assertion about it.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: carried source and fixture integrity
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is required and is required *only* here: the step below
      # re-derives the carried upstream bytes from the pinned commit itself, and
      # the default shallow depth of 1 does not contain it. No other job needs
      # history.
      #
      # Nothing in this file compares HEAD to the pin, and nothing ever should.
      # This repository is a downstream of upstream's tag by design and carries
      # its own commits on top of it, so `HEAD == 79cdd5ab…` is neither true nor
      # the property worth proving. The property worth proving is narrower and
      # stronger: **are the upstream files this repository carries still
      # upstream's bytes at that pin?**
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 56 records: the upstream files this fork carries unchanged, plus the
      # `README.upstream.md` that keeps upstream's README whole, plus the six
      # Unicode files under `testdata/`. `build.zig`, `build.zig.zon`,
      # `.gitignore` and `README.md` are absent on purpose because this fork
      # edits them in place; the record's own header names them and explains
      # why a digest for them would be false within hours, and their
      # upstream-pristine digests are in `NOTICE.md`. The step below is what
      # checks those four, in the opposite direction: that they *do* differ.
      #
      # This runs before anything is built, so a modified upstream source or a
      # drifted fixture is a failure at its own cause rather than a puzzling
      # test failure three steps later.
      - name: immutable source, licence and Unicode fixture integrity
        run: sha256sum -c UPSTREAM.sha256

      # The second anchor, and the one that proves this is a *downstream at the
      # pinned upstream bytes* rather than a tree that merely hashes to some
      # numbers recorded by hand. It reads the pinned commit out of this clone
      # and asks three questions per file:
      #
      #   1. does the record's digest equal the SHA-256 of the pinned commit's
      #      own blob for that path?      (the record is anchored to upstream)
      #   2. does the file on disk have those same bytes?  (the tree carries them)
      #   3. is every path in the pinned tree either covered by a record or
      #      declared fork-edited, and every record outside the pinned tree a
      #      `testdata/` fixture or README.upstream.md?
      #      (neither the record nor the tree has an unaccounted remainder)
      #
      # The four files the fork edits in place are the one exception to 1 and 2,
      # and the exception is explicit rather than a gap: `UPSTREAM.sha256`
      # records no digest for them, because their bytes are the fork's now, and
      # what is required of them is the opposite -- that they *do* differ from
      # the pinned blob.
      #
      # It then prints the exact set of upstream files this fork edits in place
      # and fails if that set grows past the four named in `UPSTREAM.sha256`'s
      # header. A fifth edited file, or one silently dropped from the tree,
      # fails here rather than being noticed by a reader months later.
      #
      # A shallow clone, a source tarball, or a downstream published without the
      # upstream history fails this step with a message rather than passing
      # quietly; that is deliberate, and `UPSTREAM.md` records which gates need
      # history and which do not.
      - name: the carried upstream files are the pinned commit's own bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, sys

          pin = "79cdd5ab40c79afa559f689ffc13b76812dee1ac"

          if subprocess.run(["git", "cat-file", "-e", f"{pin}^{{commit}}"]).returncode != 0:
              print(f"the pinned upstream commit {pin} is not in this clone", file=sys.stderr)
              print("this job needs the upstream history: checkout with fetch-depth: 0,", file=sys.stderr)
              print("or see UPSTREAM.md 'Import mechanism' before changing the pin", file=sys.stderr)
              sys.exit(1)

          # The only upstream paths this fork edits in place, named in
          # UPSTREAM.sha256's own header and in NOTICE.md. README.md is one of
          # them: this fork replaced its contents, and upstream's exact bytes
          # are carried whole at README.upstream.md, which the record below
          # names with the same digest.
          #
          # None of the four has a digest in UPSTREAM.sha256, by design: the
          # record's own header says so and gives the reason -- a digest for a
          # file this fork edits would be false within hours. So these four are
          # settled before the record is consulted, and the requirement for them
          # is the opposite one: the working copy must differ from the pinned
          # blob, and a record entry is neither required nor consulted.
          # Demanding a digest for them would fail this step on four files that
          # are supposed to differ.
          edited_in_place = {".gitignore", "build.zig", "build.zig.zon", "README.md"}

          # Recorded paths that are deliberately not in the pinned tree.
          # `testdata/` holds the Unicode conformance corpora, which upstream
          # downloads rather than committing (`data/Makefile:44-48`), and
          # README.upstream.md carries upstream's README whole because
          # README.md -- its path at the pin -- was replaced in place. Every
          # other recorded path that the pinned tree does not carry is an
          # error, because that is a digest with nothing to anchor it to.
          carried_outside_the_pin = {"README.upstream.md"}

          pinned = subprocess.run(
              ["git", "ls-tree", "-r", pin, "--name-only"],
              capture_output=True, text=True, check=True).stdout.split()

          records = {}
          for line in pathlib.Path("UPSTREAM.sha256").read_text(encoding="utf-8").splitlines():
              if line.startswith("#") or not line.strip():
                  continue
              digest, path = line.split("  ", 1)
              records[path] = digest

          failures = []
          divergent = set()
          fork_edited = set()
          for path in pinned:
              blob = subprocess.run(
                  ["git", "cat-file", "blob", f"{pin}:{path}"],
                  capture_output=True, check=True).stdout
              upstream_digest = hashlib.sha256(blob).hexdigest()
              try:
                  on_disk = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              except OSError as e:
                  failures.append(
                      f"{path}: upstream's tree carries it and this clone has no readable copy ({e})")
                  continue
              if path in edited_in_place:
                  fork_edited.add(path)
                  if on_disk == upstream_digest:
                      failures.append(
                          f"{path}: declared fork-edited in place, but its bytes are upstream's")
                  continue
              if path not in records:
                  failures.append(f"{path}: upstream's tree carries it and UPSTREAM.sha256 records nothing for it")
                  continue
              if upstream_digest != records[path]:
                  failures.append(
                      f"{path}: the pinned commit's blob hashes {upstream_digest}, "
                      f"the record says {records[path]}")
                  continue
              if on_disk != upstream_digest:
                  divergent.add(path)

          for path in sorted(set(records) - set(pinned)):
              if path.startswith("testdata/") or path in carried_outside_the_pin:
                  continue
              failures.append(
                  f"{path}: recorded in UPSTREAM.sha256, absent from the pinned "
                  "tree, and neither a testdata fixture nor a path carried "
                  "elsewhere on purpose")

          undeclared = sorted(divergent - edited_in_place)
          for path in undeclared:
              failures.append(
                  f"{path}: differs from the pinned commit and is not one of the four "
                  "files UPSTREAM.sha256 declares as fork-edited in place")

          if failures:
              print("\n".join("FAIL  " + f for f in failures), file=sys.stderr)
              sys.exit(1)

          edited = sorted(fork_edited)
          print(
              f"{len(pinned) - len(edited)} of the {len(pinned)} files at {pin} are carried "
              "byte for byte; UPSTREAM.sha256 anchors every one of them to upstream's own blob")
          print("fork-edited in place, and named in UPSTREAM.sha256's header: "
                + ", ".join(edited))
          print("HEAD is not compared with the pin: a downstream carries its own commits on top")
          PY

      # The two derived case fixtures must still be the sections they claim to
      # be. UPSTREAM.sha256 proves the bytes are unchanged; this proves the
      # unchanged bytes are the right ones, by re-applying upstream's own
      # extraction rule from data/Makefile and checking the result is identical
      # and that each section's ranges sum to the total the primary file declares
      # (2740 for Lowercase, 2026 for Uppercase).
      #
      # A hash alone is not enough here: `DerivedCoreProperties.txt` carries 20
      # `# Derived Property:` sections, and a wrong anchor would still produce a
      # well-formed file.
      - name: derived case fixtures still match their sections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          src = pathlib.Path("testdata/DerivedCoreProperties.txt").read_text(encoding="utf-8")
          failures = []
          for prop, expected_ranges, expected_total in (("Lowercase", 711, 2740), ("Uppercase", 678, 2026)):
              pattern = re.compile(r"# Derived Property: %s.*?# Total code points:" % prop, re.DOTALL)
              match = pattern.search(src)
              if match is None:
                  failures.append(f"{prop}: no section in DerivedCoreProperties.txt")
                  continue
              derived = match.group(0).encode("utf-8")
              shipped = pathlib.Path(f"testdata/{prop}.txt").read_bytes()
              if derived != shipped:
                  failures.append(f"{prop}: shipped file differs from the upstream extraction rule")
                  continue
              total = int(re.match(r" (\d+)\n", src[match.end():]).group(1))
              ranges = codepoints = 0
              for line in derived.decode("utf-8").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  field = line.split("#")[0].split(";")[0].strip()
                  if ".." in field:
                      lo, hi = field.split("..")
                      codepoints += int(hi, 16) - int(lo, 16) + 1
                  else:
                      codepoints += 1
                  ranges += 1
              if ranges != expected_ranges or codepoints != expected_total or total != expected_total:
                  failures.append(
                      f"{prop}: ranges={ranges} codepoints={codepoints} declared={total}, "
                      f"expected {expected_ranges}/{expected_total}/{expected_total}"
                  )
          if failures:
              print("\n".join("FAIL  " + f for f in failures), file=sys.stderr)
              sys.exit(1)
          print("Lowercase.txt and Uppercase.txt reproduce upstream's extraction from DerivedCoreProperties.txt")
          PY

      # The compiled core is upstream's, byte for byte, under a second identifier.
      # These three blob ids are the ones the pinned commit itself carries, read
      # out of `git ls-tree -r 79cdd5ab…`; recomputing them from the working tree
      # is an independent check over a different hash (git's SHA-1 blob framing)
      # that the fork has not patched the library. sha1("blob " + len + "\0" +
      # bytes), no git needed — and deliberately not the SHA-256 the step above
      # used, so a mistake in one record cannot be copied into the other.
      #
      # The pinned-tree step above already covers every upstream file this fork
      # carries, and it prints how many that was; this step earns its place by
      # naming the three files the build actually compiles, with ids anyone can
      # look up with one `git ls-tree`.
      - name: compiled core still matches the pinned commit's blob ids
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, sys

          expected = {
              "utf8proc.h": "d842f6bcdf3a2e4a70de82fda94371851cfd5567",
              "utf8proc.c": "0e277e0c27ed0d9cc3d1b254b24d6a4bfc8c9019",
              "utf8proc_data.c": "5d6bcc2fd81c335f4dabcca5f3242f29d440cdd8",
          }
          failures = []
          for name, want in expected.items():
              data = pathlib.Path(name).read_bytes()
              got = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
              if got != want:
                  failures.append(f"{name}: blob {got} != upstream's {want}")
          if failures:
              print("\n".join("FAIL  " + f for f in failures), file=sys.stderr)
              sys.exit(1)
          print("utf8proc.h, utf8proc.c and utf8proc_data.c are upstream v2.12.0's bytes")
          PY

  native:
    name: native build, tests, smoke and upstream suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Installs the library, the header, the licence and data-term records, the
      # Unicode fixtures and the generated pkg-config file into `zig-out/`, and
      # compiles smoke.zig. UTF8PROC_STATIC is on the compile line and on the
      # translation line; without it utf8proc.h makes every declaration
      # __declspec(dllimport) under _WIN32.
      - name: build
        run: zig build

      # The whole default install closure, because a package that installs its
      # header and its archive and nothing else is missing every obligation
      # that travels beside them: the Unicode Terms of Use governing the
      # compiled `utf8proc_data.c`, Unicode License V3 governing the corpora, and
      # the link metadata a C consumer would otherwise have to be told about by
      # hand. The static `.pc` must name `UTF8PROC_STATIC` and must not name
      # `UTF8PROC_EXPORTS`, which is upstream's own template value and asks a
      # consumer to export the symbols it means to use.
      - name: the static install carries the header, the pkg-config file, the records and the fixtures
        run: |
          set -euo pipefail
          test -f zig-out/lib/libutf8proc.a
          test -f zig-out/include/utf8proc.h
          test -f zig-out/LICENSE.md
          test -f zig-out/lib/pkgconfig/libutf8proc.pc
          for f in LICENSE.md FORK-LICENSE.md NOTICE.md UPSTREAM.md CHANGELOG.md Unicode-License-V3.txt; do
            test -f "zig-out/share/licenses/utf8proc/$f" || { echo "FAIL  missing $f" >&2; exit 1; }
          done
          for f in NormalizationTest.txt GraphemeBreakTest.txt DerivedCoreProperties.txt \
                   Lowercase.txt Uppercase.txt Unicode-License-V3.txt; do
            test -f "zig-out/share/utf8proc/testdata/$f" || { echo "FAIL  missing $f" >&2; exit 1; }
          done
          grep -F 'prefix=${pcfiledir}/../..' zig-out/lib/pkgconfig/libutf8proc.pc
          grep -F 'Cflags: -I${includedir} -DUTF8PROC_STATIC' zig-out/lib/pkgconfig/libutf8proc.pc
          ! grep -F 'DUTF8PROC_EXPORTS' zig-out/lib/pkgconfig/libutf8proc.pc
          # The substitution happened and produced a three-part version. The
          # value itself is the package's own pin and belongs to the provenance
          # record, not to a gate here; what this step owns is that the metadata
          # a consumer reads is well formed.
          grep -E '^Version: [0-9]+\.[0-9]+\.[0-9]+$' zig-out/lib/pkgconfig/libutf8proc.pc
          ! grep -F 'VERSION' zig-out/lib/pkgconfig/libutf8proc.pc

      # Every other step in this job reaches utf8proc through the Zig facade.
      # This one reaches it the way a C program does: the installed public
      # header, the installed static archive, and no Zig code at all. None of
      # the other steps would notice a facade that is correct while the C
      # surface a C caller compiles against is not, and this fork is a C
      # library first.
      #
      # The expected values come from the Unicode standard, from upstream's own
      # test sources, and from `utf8proc.h`'s documented contracts — never from a
      # previous run of this build, so a wrong answer and a wrong expectation
      # fail it differently. Where an assertion needs a version string it is not
      # asserted here at all: the Unicode data version is cross-checked against
      # upstream's own `data/Makefile` by `test/misc.c` in the `upstream-test`
      # step, which is the gate that owns that claim.
      - name: installed C headers compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          /* The installed utf8proc C surface, reached the way a C program
             reaches it: the installed public header, the installed static
             archive, and no Zig code at all. Every other step in this job
             reaches the library through the Zig facade, so none of them would
             notice a facade that is correct while the C surface a C caller
             compiles against is not, and this fork is a C library first. */
          #include <utf8proc.h>
          #include <stdio.h>

          static int gFailures = 0;

          static void expect(int condition, const char *what) {
              if (condition) {
                  printf("ok    %s\n", what);
              } else {
                  printf("FAIL  %s\n", what);
                  gFailures += 1;
              }
          }

          int main(void) {
              utf8proc_int32_t out[16];
              utf8proc_ssize_t n;
              utf8proc_uint8_t encoded[4];
              utf8proc_int32_t codepoint = -1;
              const utf8proc_property_t *prop;

              /* Library identity, read out of the archive this program linked. */
              printf("utf8proc %s, Unicode %s\n",
                     utf8proc_version(), utf8proc_unicode_version());
              /* NB: no assertion on the version strings. Both are printed above
                 because a C consumer can see them, and pinning either of them
                 here would test the pin rather than the library — the workspace
                 rule puts version identity in the provenance record and in
                 upstream's own UNICODE_VERSION cross-check, and both are run in
                 this job. */

              /* NFD of U+00E9 LATIN SMALL LETTER E WITH ACUTE is the two
                 code points U+0065 U+0301: NormalizationTest.txt's rule
                 NFC(c2) == toNFC(c3) fixes this pair, and it is the canonical
                 decomposition recorded in UnicodeData.txt. */
              n = utf8proc_decompose_char(0x00E9, out, 16, UTF8PROC_DECOMPOSE, NULL);
              expect(n == 2, "U+00E9 canonically decomposes to two code points");
              expect(n == 2 && out[0] == 0x0065 && out[1] == 0x0301,
                     "U+00E9 decomposes to U+0065 U+0301");

              /* The ligature, which is where an option word goes wrong.
                 U+FB01 LATIN SMALL LIGATURE FI maps to U+0066 U+0069 through a
                 *compatibility* decomposition, and utf8proc.c:513-518 only takes
                 a character's decomposition entry when its mapping type is
                 canonical OR UTF8PROC_COMPAT is set. With UTF8PROC_DECOMPOSE
                 alone this call returns the character unchanged, so an assertion
                 of U+0066 U+0069 here was asserting NFKD through a call that
                 asked for NFD. Both halves are asserted, because they are two
                 different claims about two different option words. NFKD is the
                 form this pair names (utf8proc.h:791-792). */
              n = utf8proc_decompose_char(0xFB01, out, 16, UTF8PROC_DECOMPOSE, NULL);
              expect(n == 1 && out[0] == 0xFB01,
                     "UTF8PROC_DECOMPOSE alone leaves the U+FB01 compatibility mapping alone");
              n = utf8proc_decompose_char(0xFB01, out, 16,
                                           UTF8PROC_DECOMPOSE | UTF8PROC_COMPAT, NULL);
              expect(n == 2 && out[0] == 0x0066 && out[1] == 0x0069,
                     "U+FB01 compatibility-decomposes to U+0066 U+0069 given UTF8PROC_COMPAT");

              /* Algorithmic Hangul: U+AC00 HANGUL SYLLABLE GA is U+1100
                 U+1161, and neither jamo is in UnicodeData.txt. */
              n = utf8proc_decompose_char(0xAC00, out, 16, UTF8PROC_DECOMPOSE, NULL);
              expect(n == 2 && out[0] == 0x1100 && out[1] == 0x1161,
                     "U+AC00 decomposes to the jamo U+1100 U+1161");

              /* Full case folding of U+00DF is the two code points U+0073
                 U+0073. A simple mapping cannot produce two, which is what
                 separates CaseFolding.txt's F status from a simple mapping. */
              n = utf8proc_decompose_char(0x00DF, out, 16, UTF8PROC_CASEFOLD, NULL);
              expect(n == 2 && out[0] == 0x0073 && out[1] == 0x0073,
                     "U+00DF case-folds to U+0073 U+0073");
              expect(utf8proc_tolower(0x00DF) == 0x00DF,
                     "the simple lowercase mapping leaves U+00DF alone");

              /* Scalars and widths. U+1F600 GRINNING FACE is East Asian Wide,
                 so width 2; U+0009 TAB is a control, so width 0 -- where the C
                 library's wcwidth would say -1. */
              expect(utf8proc_charwidth(0x1F600) == 2, "U+1F600 is two cells wide");
              expect(utf8proc_charwidth(0x0009) == 0, "U+0009 is zero cells wide");
              expect(utf8proc_codepoint_valid(0xD800) == 0,
                     "a surrogate half is not a valid scalar value");
              expect(utf8proc_codepoint_valid(0x1F600) != 0,
                     "U+1F600 is a valid scalar value");

              /* The four codepoints upstream's own width test pins, and only
                 those: test/charwidth.c:65-71 asserts them with no wcwidth
                 oracle, so they are independent known answers rather than this
                 build's own output. U+00AD SOFT HYPHEN and U+E000 (private
                 use) are one cell wide and East Asian Ambiguous; U+00A1 is
                 Ambiguous and U+00A2 is not. */
              expect(utf8proc_charwidth(0x00AD) == 1,
                     "U+00AD soft hyphen is one cell wide, not zero");
              expect(utf8proc_charwidth_ambiguous(0x00AD),
                     "U+00AD is East Asian Ambiguous");
              expect(utf8proc_charwidth(0xE000) == 1,
                     "U+E000 private use is one cell wide");
              expect(utf8proc_charwidth_ambiguous(0xE000),
                     "U+E000 is East Asian Ambiguous");
              expect(utf8proc_charwidth_ambiguous(0x00A1),
                     "U+00A1 is East Asian Ambiguous");
              expect(!utf8proc_charwidth_ambiguous(0x00A2),
                     "U+00A2 is not East Asian Ambiguous");

              /* Iteration rejects the 0xFF byte that UTF8PROC_CHARBOUND emits,
                 which is the documented asymmetry rather than a defect. */
              {
                  const char bad[] = { (char)0xFF, 0 };
                  expect(utf8proc_iterate((const utf8proc_uint8_t *)bad, 1, &codepoint) < 0,
                         "utf8proc_iterate rejects a 0xFF byte");
              }

              /* Encoding does not validate: it encodes a surrogate on purpose,
                 so only values outside [0, 0x110000) come back as 0. */
              expect(utf8proc_encode_char(0x1F600, encoded) == 4, "U+1F600 encodes to four bytes");
              expect(utf8proc_encode_char(0x110000, encoded) == 0,
                     "a code point above U+10FFFF is not encoded");

              /* The property record is reachable from C, with the bit fields
                 intact -- which is exactly what the Zig facade cannot offer and
                 a C consumer relies on. */
              prop = utf8proc_get_property(0x0041);
              expect(prop != NULL && prop->category == UTF8PROC_CATEGORY_LU,
                     "U+0041 has general category Lu");
              expect(prop != NULL && prop->bidi_mirrored == 0,
                     "U+0041 is not bidi-mirrored");

              /* General category of an unassigned code point is CN, not an
                 error and not a crash. */
              expect(utf8proc_category(0x0378) == UTF8PROC_CATEGORY_CN,
                     "an unassigned code point reports category Cn");

              if (gFailures != 0) {
                  printf("%d check(s) failed\n", gFailures);
                  return 1;
              }

              printf("the installed C surface compiled, linked and ran\n");
              return 0;
          }
          C
          # -DUTF8PROC_STATIC is mandatory here for the same reason it is on
          # the archive's own compile line: utf8proc.h makes UTF8PROC_DLLEXPORT
          # __declspec(dllimport) under _WIN32 unless it or UTF8PROC_STATIC is
          # defined, so a consumer that omits it fails to link on Windows.
          zig cc \
            -DUTF8PROC_STATIC \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface_gate.c" \
            zig-out/lib/libutf8proc.a \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # Two runs, one per mode. `build.zig` takes the mode from the standard
      # `-Doptimize` option, so `zig build test` runs exactly one mode: Debug and
      # ReleaseSafe are two invocations here, because they are the two modes where
      # Zig's safety checks are live and this package promises its guards as
      # ordinary runtime checks rather than assertions.
      #
      # `test` also runs the API exercise at the end — the program that calls
      # every public facade function — so one command covers the behavioural
      # tests and the whole public surface together.
      #
      # This is where the whole corpus is replayed: all 20171 rows of
      # NormalizationTest.txt at 20 conformance checks each, all 853 rows of
      # GraphemeBreakTest.txt checked twice, and every Lowercase and Uppercase
      # range with the gaps between them. No sampling.
      - name: test (Debug)
        run: zig build test

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: smoke
        run: zig build smoke

      # Upstream's own C suite against this archive: nine of the eleven programs
      # its `check` target builds. normtest and graphemetest are handed the
      # committed testdata/ paths; iscase gets Lowercase then Uppercase, in that
      # order, as test/iscase.c:58 requires.
      #
      # -DUNICODE_VERSION is passed explicitly because test/misc.c's assertion
      # that utf8proc_unicode_version() agrees with data/Makefile sits inside an
      # #ifdef: without the define the check disappears silently and the program
      # still exits 0.
      - name: upstream's own C test programs
        run: zig build upstream-test

      # ---------------------------------------------------------------------
      # The shared delivery. `-Dlinkage=dynamic` is a new artifact class, not a
      # linkage flip, so nothing above observes it: a static compile says
      # nothing about whether the shared object links, exports, carries
      # upstream's soname, or produces the pkg-config file a C consumer needs.
      # It is installed into its own prefix so the two closures cannot be
      # confused for one another.
      #
      # Every expected name and every expected value below is read out of
      # upstream's own build files: the file and link names from `Makefile:35-38`
      # and `Makefile:57-61`, the soname from `MAJOR=3` at `Makefile:25`, the
      # installed header destination from `CMakeLists.txt:50`, the pkg-config
      # destination from `Makefile:45` and `CMakeLists.txt:58`, and the answer
      # each function gives from Unicode itself.
      - name: build the shared object into its own prefix
        run: |
          set -euo pipefail
          zig build -Dlinkage=dynamic --prefix "$RUNNER_TEMP/shared" --summary all
          ls -l "$RUNNER_TEMP/shared/lib" "$RUNNER_TEMP/shared/include"

      # Upstream's own ABI version, on the file, on the soname and on the
      # version links. `Makefile:25-27` is `MAJOR=3 MINOR=3 PATCH=0` and
      # `MANIFEST` carries the same 3/3/0; this is the ABI version, not the API
      # version 2.12.0, and `utf8proc.h:66-68` says the two answer different
      # questions.
      - name: the shared object carries upstream's ABI soname and version links
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/shared/lib"
          test -f "$lib/libutf8proc.so.3.3.0"
          test -L "$lib/libutf8proc.so.3" && test "$(readlink "$lib/libutf8proc.so.3")" = "libutf8proc.so.3.3.0"
          test -L "$lib/libutf8proc.so" && test "$(readlink "$lib/libutf8proc.so")" = "libutf8proc.so.3"
          readelf -d "$lib/libutf8proc.so.3.3.0" | grep -F "SONAME" | grep -F "libutf8proc.so.3"

      # The export table is what a shared object *is*. The list below is the
      # complete set of `UTF8PROC_DLLEXPORT` declarations in `utf8proc.h`, read
      # out of that header rather than out of an earlier run of this build, and
      # it includes the one exported **data** symbol: `utf8proc.h:453` declares
      # `utf8proc_utf8class` extern and `utf8proc.c:56` defines it with the
      # export macro. A library that exported every function but dropped the
      # data object would compile, link and still be wrong for every consumer
      # that reads the table. On this target the same macro is
      # `__attribute__((visibility("default")))` (`utf8proc.h:135`); the Windows
      # equivalent is `__declspec(dllexport)`, which `-DUTF8PROC_EXPORTS` on the
      # library's own compile line selects and this matrix cannot observe.
      - name: the export table carries the whole utf8proc.h surface, data symbol included
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/shared/lib/libutf8proc.so.3.3.0"
          nm -D --defined-only "$lib" | awk 'NF >= 3 { print $NF }' | sort > "$RUNNER_TEMP/exports.txt"
          for symbol in utf8proc_version utf8proc_unicode_version utf8proc_errmsg \
                        utf8proc_iterate utf8proc_codepoint_valid utf8proc_encode_char \
                        utf8proc_get_property utf8proc_decompose_char utf8proc_decompose \
                        utf8proc_decompose_custom utf8proc_normalize_utf32 utf8proc_reencode \
                        utf8proc_map utf8proc_map_custom utf8proc_NFC utf8proc_NFD \
                        utf8proc_NFKC utf8proc_NFKD utf8proc_NFKC_Casefold utf8proc_free \
                        utf8proc_grapheme_break utf8proc_grapheme_break_stateful \
                        utf8proc_tolower utf8proc_toupper utf8proc_totitle utf8proc_islower \
                        utf8proc_isupper utf8proc_charwidth utf8proc_charwidth_ambiguous \
                        utf8proc_category utf8proc_category_string utf8proc_utf8class; do
            grep -qx "$symbol" "$RUNNER_TEMP/exports.txt" || {
              echo "FAIL  $symbol is not exported from the shared object" >&2
              exit 1
            }
          done
          echo "all 32 UTF8PROC_DLLEXPORT names are exported, $(wc -l < "$RUNNER_TEMP/exports.txt") symbols in total"
          # utf8proc_utf8class is data, not code: `nm` classifies it R or D, and
          # a build that exported only functions would type it differently.
          nm -D --defined-only "$lib" | awk 'NF >= 3 { print $(NF-1), $NF }' \
            | grep -E '^[A-Z] utf8proc_utf8class$'

      # The whole install closure, which the static job above never sees: the
      # generated link metadata, the licence and data-term records, and the
      # committed Unicode fixtures with the terms that govern them.
      - name: the shared install carries the header, the pkg-config file, the records and the fixtures
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/shared"
          test -f "$p/include/utf8proc.h"
          test -f "$p/lib/pkgconfig/libutf8proc.pc"
          test -f "$p/LICENSE.md"
          for f in LICENSE.md FORK-LICENSE.md NOTICE.md UPSTREAM.md CHANGELOG.md Unicode-License-V3.txt; do
            test -f "$p/share/licenses/utf8proc/$f" || { echo "FAIL  missing $f" >&2; exit 1; }
          done
          for f in NormalizationTest.txt GraphemeBreakTest.txt DerivedCoreProperties.txt \
                   Lowercase.txt Uppercase.txt Unicode-License-V3.txt; do
            test -f "$p/share/utf8proc/testdata/$f" || { echo "FAIL  missing $f" >&2; exit 1; }
          done
          # Relocatable metadata: `prefix` is derived from `pcfiledir`, so the
          # tree can be moved and the file still describes the copy it travels
          # with. Upstream's own templates substitute an absolute `--prefix`
          # (`Makefile:100-106`), which would describe the old location.
          grep -F 'prefix=${pcfiledir}/../..' "$p/lib/pkgconfig/libutf8proc.pc"
          # The shared delivery's Cflags must carry no macro at all: with
          # `UTF8PROC_STATIC` the header leaves the export macro empty, which is
          # right for an archive and wrong for a DLL, and with
          # `UTF8PROC_EXPORTS` -- which upstream's own templates put here -- a
          # consumer would ask for its own symbols to be exported.
          ! grep -F 'DUTF8PROC_' "$p/lib/pkgconfig/libutf8proc.pc"
          grep -E '^Version: [0-9]+\.[0-9]+\.[0-9]+$' "$p/lib/pkgconfig/libutf8proc.pc"

      # A C consumer that never sees this repository: it is compiled from the
      # flags `pkg-config` reports, against the installed header, and run
      # through the dynamic loader. That is the whole point of shipping the
      # metadata, and it is what fails if the soname, the export table or the
      # data symbol is wrong. The static job's own C gate cannot see any of it.
      - name: a C consumer built from the generated pkg-config flags runs against the shared object
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/shared_c_gate.c" <<'C'
          /* The installed shared library reached the way a C consumer reaches
             it: pkg-config's own flags, the installed header, and the loader. */
          #include <utf8proc.h>
          #include <stdio.h>

          static int failures = 0;

          static void expect(int condition, const char *what) {
              printf("%s  %s\n", condition ? "ok  " : "FAIL", what);
              if (!condition) failures += 1;
          }

          int main(void) {
              utf8proc_int32_t out[16];
              utf8proc_ssize_t n;

              /* Printed, not asserted: version identity belongs to the
                 provenance record, and pinning it here would test the pin. */
              printf("utf8proc %s, Unicode %s\n",
                     utf8proc_version(), utf8proc_unicode_version());

              /* U+00E9 is U+0065 U+0301 in NFD -- UnicodeData.txt's canonical
                 decomposition, and NormalizationTest.txt's own c2/c3 pair. */
              n = utf8proc_decompose_char(0x00E9, out, 16, UTF8PROC_DECOMPOSE, NULL);
              expect(n == 2 && out[0] == 0x0065 && out[1] == 0x0301,
                     "U+00E9 decomposes to U+0065 U+0301 through the shared library");

              /* The exported data symbol, not just a function: utf8proc.h:453
                 declares `utf8proc_utf8class` extern and utf8proc.c:56 defines
                 it with the export macro. ASCII 'A' is a single-byte UTF-8
                 start byte, so the table classifies it 1. */
              expect(utf8proc_utf8class[0x41] == 1,
                     "the exported utf8proc_utf8class table is readable from the shared object");

              /* utf8proc_map allocates through malloc and utf8proc_free (2.12.0)
                 releases it, so this is also the pair a consumer of this version
                 has to be able to call across the library boundary. U+00E9 in
                 NFC is the same two bytes it already had. */
              {
                  utf8proc_uint8_t *buffer = NULL;
                  utf8proc_ssize_t len = utf8proc_map((const utf8proc_uint8_t *)"\xC3\xA9", 2, &buffer, 0);
                  expect(len == 2 && buffer != NULL,
                         "utf8proc_map normalised through the shared library and utf8proc_free releases it");
                  utf8proc_free(buffer);
              }

              expect(utf8proc_charwidth(0x00AD) == 1, "U+00AD is one cell wide, not zero");

              printf("%s\n", failures == 0
                  ? "the installed shared C surface compiled, linked, loaded and ran"
                  : "the installed shared C surface disagreed with Unicode");
              return failures == 0 ? 0 : 1;
          }
          C
          export PKG_CONFIG_PATH="$RUNNER_TEMP/shared/lib/pkgconfig"
          pkg-config --exists libutf8proc
          # shellcheck disable=SC2046
          zig cc $(pkg-config --cflags libutf8proc) \
            "$RUNNER_TEMP/shared_c_gate.c" $(pkg-config --libs libutf8proc) \
            -o "$RUNNER_TEMP/shared_c_gate"
          LD_LIBRARY_PATH="$RUNNER_TEMP/shared/lib" "$RUNNER_TEMP/shared_c_gate"

      # The same relocation property, proved by moving the tree rather than by
      # reading the file: a `.pc` carrying an absolute prefix describes the
      # location it was built at, and this is the step that tells the two apart.
      - name: the installed tree is relocatable
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/shared" "$RUNNER_TEMP/moved"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/moved/lib/pkgconfig"
          pkg-config --variable=libdir libutf8proc | grep -F "$RUNNER_TEMP/moved/lib"
          cat > "$RUNNER_TEMP/relocated.c" <<'C'
          #include <utf8proc.h>
          int main(void) {
              utf8proc_int32_t out[4];
              return utf8proc_decompose_char(0x00E9, out, 4, UTF8PROC_DECOMPOSE, NULL) == 2 ? 0 : 1;
          }
          C
          # shellcheck disable=SC2046
          zig cc $(pkg-config --cflags libutf8proc) \
            "$RUNNER_TEMP/relocated.c" $(pkg-config --libs libutf8proc) \
            -o "$RUNNER_TEMP/relocated"
          LD_LIBRARY_PATH="$RUNNER_TEMP/moved/lib" "$RUNNER_TEMP/relocated"
          echo "the moved prefix still compiles, links and runs a C consumer"

      # The behavioural surface, the smoke program and upstream's own C suite
      # against the shared object, in the two modes where Zig's safety checks
      # are live. The C programs get no macro here: they include `utf8proc.h`
      # and link the DLL, which is `utf8proc.h:132`'s own answer.
      - name: test (shared object, Debug)
        run: zig build test -Dlinkage=dynamic

      - name: test (shared object, ReleaseSafe)
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSafe

      - name: smoke (shared object)
        run: zig build smoke -Dlinkage=dynamic

      - name: upstream's own C test programs (shared object)
        run: zig build upstream-test -Dlinkage=dynamic

      - name: the consumer package, through the shared object
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic

      # The runtime route, exercised through the consumer because that is the
      # only root in this package that branches on `runtime_loaded` at comptime.
      # The provider is the shared object this job just built: the route names a
      # provider explicitly, and pointing it at this tree's own output is what
      # makes the answers below comparable with the linked run's. Nothing here
      # links that library into the consumer's module -- that is the property
      # under test, and a build that linked it would pass by being wrong.
      #
      # `UTF8PROC_TEST_PROVIDER` is read by `consumer/src/main.zig` and can only
      # be set by the caller; the build does not inject paths into a run step's
      # environment, so without it the program says which variable is missing
      # rather than failing on an unresolved symbol.
      - name: the runtime route, with this build's shared object as the provider
        run: |
          set -euo pipefail
          export UTF8PROC_TEST_PROVIDER="$RUNNER_TEMP/shared/lib/libutf8proc.so.3.3.0"
          test -f "$UTF8PROC_TEST_PROVIDER"
          (cd consumer && zig build run -Druntime=true --cache-dir "$RUNNER_TEMP/consumer-runtime")
          echo "the same consumer answers through a named provider with nothing linked into its module"
      - name: the runtime route refuses to run without a provider
        run: |
          set -euo pipefail
          unset UTF8PROC_TEST_PROVIDER
          if (cd consumer && zig build run -Druntime=true --cache-dir "$RUNNER_TEMP/consumer-runtime-noprov") \
               >"$RUNNER_TEMP/noprov.log" 2>&1; then
            echo "FAIL  a runtime-loaded consumer ran with no provider named" >&2
            cat "$RUNNER_TEMP/noprov.log" >&2
            exit 1
          fi
          grep -F "UTF8PROC_TEST_PROVIDER" "$RUNNER_TEMP/noprov.log"

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Compiles without running. Every public facade body, the tests, the API
      # exercise, the smoke example and the nine upstream C programs must compile
      # and link for each target. A foreign compile that succeeds is build_only,
      # not a passing test; a target with no runner here is never reported as a
      # pass.
      #
      # Two source-level constraints bound this matrix and are not predictions:
      # x86_64-windows-gnu is the one cell where a missing UTF8PROC_STATIC fails
      # loudly, because utf8proc.h turns every declaration into
      # __declspec(dllimport) without it; and wasm32-wasi plus
      # aarch64-macos-none need libc, which this library uses for malloc, realloc
      # and free.
      - name: Compile the full library and public API
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

  # The same six targets through `-Dlinkage=dynamic`, as its own job rather than
  # another matrix dimension: a shared object is a new artifact class and not a
  # linkage flip, so "the static graph compiles for this target" says nothing
  # about whether the shared one does.
  #
  # Five cells, because a requested shared object on a target that cannot carry
  # one is refused rather than answered with an archive, and a cell that is
  # refused is not a cell. `wasm32-wasi` has no dynamic linker at all
  # (`std.Target.DynamicLinker.kind` is `.none` for it), so it is the sixth
  # target's absence from this matrix, asserted by the step below rather than
  # assumed -- and it is still in the `cross` job above, because the default
  # graph is static there and a static archive on WASI is ordinary. Nothing in
  # this file is marked continue-on-error.
  cross-shared:
    name: check shared ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Compile the full library and public API as a shared object
        run: zig build check -Dtarget=${{ matrix.target }} -Dlinkage=dynamic --summary all


  # The refusal itself, as its own job and as a gate rather than as an omission.
  # It is separate from `cross-shared` because it is not a matrix cell: it is
  # the one target that has no cell there, and the property worth proving is
  # that the command fails and says why. A build that quietly delivered an
  # archive would still exit zero, would still install something, and would
  # leave every later gate measuring a library nobody asked for.
  #
  # This is not `continue-on-error` and not an expected environment failure: the
  # non-zero exit *is* the assertion, and the message is checked for the
  # target's name and the reason, so a build that failed for any other reason
  # fails this job too.
  linkage-refusal:
    name: a shared object a target cannot carry is refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: -Dlinkage=dynamic on wasm32-wasi is refused, and the default is not
        run: |
          set -euo pipefail
          if zig build check -Dtarget=wasm32-wasi -Dlinkage=dynamic --summary all \
               >"$RUNNER_TEMP/wasi-shared.log" 2>&1; then
            echo "FAIL  -Dlinkage=dynamic was accepted on wasm32-wasi" >&2
            cat "$RUNNER_TEMP/wasi-shared.log" >&2
            exit 1
          fi
          grep -F "wasm32-wasi" "$RUNNER_TEMP/wasi-shared.log"
          grep -F "no dynamic linker" "$RUNNER_TEMP/wasi-shared.log"
          grep -F "will not hand back a static archive" "$RUNNER_TEMP/wasi-shared.log"
          # The same target in the default graph, which is an ordinary static
          # archive: that is what a default looks like beside a refusal, and the
          # difference between the two is the whole of this gate.
          zig build check -Dtarget=wasm32-wasi --summary all
          echo "wasm32-wasi refuses a shared object and accepts the default static archive"

  consumer:
    name: package closure and consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `.paths` is what a fetched copy of this package contains, and it is the
      # one part of the closure that a *path* dependency cannot test: `consumer/`
      # resolves this package by relative path, so it sees the working tree and
      # would keep passing with the native core missing from `.paths` — which is
      # exactly what had happened. A fetched dependent would have got a package
      # with no `utf8proc.c`, no `utf8proc.h` and no `utf8proc_data.c`.
      #
      # So the closure is walked here and compared in both directions: every
      # `.paths` entry must exist, and every file in the repository must be
      # covered by one. The only permitted residue is the CI list below, which is
      # carried for audit and shipped to nobody, and is named in
      # `build.zig.zon`'s own trailing comment and in `UPSTREAM.md`.
      - name: the .paths closure is complete and nothing stale is left in it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(".")

          # Upstream's own CI (kept byte for byte, hashed in UPSTREAM.sha256, run
          # by nobody here) and this fork's own workflow. Deliberately not
          # shipped: they describe upstream's CMake/Make/AppVeyor projects and
          # this fork's GitHub runners, not the package.
          carried_not_shipped = {
              ".github/dependabot.yml",
              ".github/workflows/ci-fuzz.yml",
              ".github/workflows/cmake.yml",
              ".github/workflows/make.yml",
              ".github/workflows/zig.yml",
              "appveyor.yml",
              ".github/workflows/verify.yml",
          }

          manifest = (root / "build.zig.zon").read_text(encoding="utf-8")
          start = manifest.index(".paths = .{")
          end = manifest.index("\n    },", start)
          block = manifest[start:end]
          # Strip `//` comments first: the prose in this manifest quotes
          # `dep.module("utf8proc")` and "no build-time download", and neither is
          # a path.
          block = "\n".join(line.split("//", 1)[0] for line in block.splitlines())
          entries = re.findall(r'"([^"]+)"', block)

          covered, failures = set(), []
          for entry in entries:
              path = root / entry
              if path.is_dir():
                  covered |= {
                      str(f.relative_to(root)) for f in path.rglob("*") if f.is_file()
                  }
              elif path.is_file():
                  covered.add(entry)
              else:
                  failures.append(f"{entry}: listed in .paths and absent from the repository")

          present = set()
          for f in root.rglob("*"):
              rel = f.relative_to(root)
              if any(part in (".git", ".zig-cache", "zig-out") for part in rel.parts):
                  continue
              if f.is_file():
                  present.add(str(rel))

          for path in sorted(present - covered - carried_not_shipped):
              failures.append(f"{path}: in the repository, in no .paths entry, and not CI")
          for path in sorted(covered - present):
              failures.append(f"{path}: covered by .paths and absent from the repository")
          for path in sorted(carried_not_shipped - present):
              failures.append(f"{path}: listed as carried-but-not-shipped and absent")

          for core in ("utf8proc.c", "utf8proc.h", "utf8proc_data.c"):
              if core not in covered:
                  failures.append(f"{core}: the native core must travel with the package")

          if failures:
              print("\n".join("FAIL  " + f for f in failures), file=sys.stderr)
              sys.exit(1)

          print(f"{len(entries)} .paths entries cover {len(covered)} files; "
                f"{len(carried_not_shipped)} CI files are carried and shipped to nobody")
          PY

      # The failure the step above cannot make: a module that builds from the
      # inside and does not resolve from outside, with nothing in `consumer/`
      # asked for beyond `dep.module("utf8proc")` by relative path.
      - name: run
        working-directory: consumer
        run: zig build run
